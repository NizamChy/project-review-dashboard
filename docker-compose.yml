services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: project_app
      POSTGRES_PASSWORD: project_app_password
      POSTGRES_DB: project_review
    ports:
      - "5432:5432"
    volumes:
      - project_review_data:/var/lib/postgresql/data
volumes:
  project_review_data:
